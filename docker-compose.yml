services:
  codetwin:
    build: .
    image: codetwin-ai:latest
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - codetwin-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
volumes:
  codetwin-data:
